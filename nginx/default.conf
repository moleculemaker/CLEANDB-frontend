server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;
    root         /usr/share/nginx/html;

    #access_log  /var/log/nginx/host.access.log  main;

    location ~ ^/(ketcher|static/) {
        # Proxy these requests to our MarvinJS production backend
        proxy_pass https://ketcher.services.platform.moleculemaker.org;
    }

    # Content-hashed build output, which the Angular application builder writes
    # only at the root (main-XXXXXXXX.js, chunk-XXXXXXXX.js, styles-XXXXXXXX.css)
    # and under media/ (fonts and images referenced from CSS). The name changes
    # whenever the content does, so it is safe to cache forever. Files copied
    # verbatim from src/assets are never hashed and are deliberately excluded.
    # A missing chunk is a real 404 here rather than falling through to index.html.
    location ~ "^/(media/)?[^/]+-[A-Z0-9]{8}\.(js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|webp)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Written by entrypoint.sh at container start; must never be served stale.
    location = /assets/config/envvars.json {
        add_header Cache-Control "no-store";
    }

    # index.html and unhashed assets: browsers may keep a copy but must
    # revalidate it on every use so a new deploy is picked up immediately.
    location / {
        index  index.html index.htm;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html =404;
    }

    #error_page  404              /404.html;

    # redirect server error pages to the static page /50x.html
    #
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

    # proxy the PHP scripts to Apache listening on 127.0.0.1:80
    #
    #location ~ \.php$ {
    #    proxy_pass   http://127.0.0.1;
    #}

    # pass the PHP scripts to FastCGI server listening on 127.0.0.1:9000
    #
    #location ~ \.php$ {
    #    root           html;
    #    fastcgi_pass   127.0.0.1:9000;
    #    fastcgi_index  index.php;
    #    fastcgi_param  SCRIPT_FILENAME  /scripts$fastcgi_script_name;
    #    include        fastcgi_params;
    #}

    # deny access to .htaccess files, if Apache's document root
    # concurs with nginx's one
    #
    #location ~ /\.ht {
    #    deny  all;
    #}
}
