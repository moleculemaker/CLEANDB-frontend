name: Unit Tests
on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    name: Karma on Chrome
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Checkout
        uses: actions/checkout@v4

      # The lockfile resolves ~1580 of its packages through the chemaxon
      # Artifactory mirror, which 401s anonymously, so that credential is
      # required even though no @chemaxon-scoped package remains in
      # package.json. Kept identical to e2e.yml / docker.yml / cron.yml.
      - name: Authenticate with private NPM packages
        run: |
          echo "@chemaxon:registry=https://hub.chemaxon.com/artifactory/api/npm/npm/" > $HOME/.npmrc
          echo "//hub.chemaxon.com/artifactory/api/npm/npm/:_auth=${{ secrets.NPM_TOKEN }}" >> $HOME/.npmrc
          echo "@moleculemaker:registry=https://npm.pkg.github.com" >> $HOME/.npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GH_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}" >> $HOME/.npmrc

      - name: Install dependencies
        run: |
          npm ci

      - name: Run unit tests
        run: |
          npx ng test --watch=false --browsers=ChromeHeadless
